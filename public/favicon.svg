<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="90%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners for App Icon Standard -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="url(#glowGrad)" />
  
  <!-- Outer Gold Border -->
  <rect x="14" y="14" width="484" height="484" rx="103" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85" />
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Central Biometric Shield -->
  <g filter="url(#shadow)">
    <!-- Outer Shield Path -->
    <path d="M 256,70 
             C 330,70 400,92 410,140 
             C 410,270 360,375 256,435 
             C 152,375 102,270 102,140 
             C 112,92 182,70 256,70 Z" 
          fill="#0a152e" 
          stroke="url(#goldGrad)" 
          stroke-width="7" />

    <!-- Inner Shield Inset -->
    <path d="M 256,88 
             C 318,88 382,106 390,146 
             C 390,256 348,352 256,412 
             C 164,352 122,256 122,146 
             C 130,106 194,88 256,88 Z" 
          fill="#070d1f" 
          stroke="#0284c7" 
          stroke-width="2.5" 
          opacity="0.7" />

    <!-- UAE Flag Color Accent Ribbons inside Shield -->
    <g opacity="0.9">
      <!-- Green Band -->
      <path d="M 185,150 L 327,150 L 322,176 L 190,176 Z" fill="url(#emeraldGrad)" />
      <!-- White Band -->
      <path d="M 191,180 L 321,180 L 316,206 L 196,206 Z" fill="#f8fafc" />
      <!-- Black Band -->
      <path d="M 197,210 L 315,210 L 308,236 L 204,236 Z" fill="#090d16" stroke="#334155" stroke-width="1" />
      <!-- Red Vertical Bar (UAE Flag hoist) -->
      <path d="M 166,145 L 192,150 L 202,242 L 176,234 Z" fill="#dc2626" />
    </g>

    <!-- Golden Falcon & UAE Stars Wings -->
    <g fill="url(#goldGrad)" filter="url(#glow)">
      <!-- Left Falcon Wing -->
      <path d="M 240,250 C 200,230 140,245 130,290 C 160,295 190,285 210,270 C 180,285 155,310 160,335 C 185,325 210,310 230,290 C 210,310 195,335 205,355 C 225,340 240,320 248,298 Z" />
      <!-- Right Falcon Wing -->
      <path d="M 272,250 C 312,230 372,245 382,290 C 352,295 322,285 302,270 C 332,285 357,310 352,335 C 327,325 302,310 282,290 C 302,310 317,335 307,355 C 287,340 272,320 264,298 Z" />
      <!-- Falcon Head & Golden Crown -->
      <circle cx="256" cy="245" r="16" />
      <path d="M 256,232 L 265,248 L 247,248 Z" />
      <circle cx="256" cy="222" r="4.5" fill="#fef08a" />
      <!-- Seven UAE Stars (7 Emirates) -->
      <circle cx="256" cy="116" r="5" fill="#fef08a" />
      <circle cx="228" cy="120" r="4" fill="#fef08a" />
      <circle cx="284" cy="120" r="4" fill="#fef08a" />
      <circle cx="204" cy="129" r="3.5" fill="#fef08a" />
      <circle cx="308" cy="129" r="3.5" fill="#fef08a" />
      <circle cx="182" cy="144" r="3" fill="#fef08a" />
      <circle cx="330" cy="144" r="3" fill="#fef08a" />
    </g>

    <!-- AI Biometric Scanner Wave Effect -->
    <g stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95">
      <line x1="170" y1="310" x2="342" y2="310" stroke-width="3" filter="url(#glow)" />
      <!-- Target Corner Brackets -->
      <path d="M 200,285 L 180,285 L 180,305" />
      <path d="M 312,285 L 332,285 L 332,305" />
      <path d="M 180,320 L 180,340 L 200,340" />
      <path d="M 332,320 L 332,340 L 312,340" />
    </g>

    <!-- Microchip / AI Nodes -->
    <circle cx="256" cy="310" r="6" fill="#38bdf8" filter="url(#glow)" />
    <line x1="256" y1="316" x2="256" y2="365" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="256" cy="365" r="5" fill="url(#goldGrad)" />
    <line x1="256" y1="340" x2="225" y2="355" stroke="#38bdf8" stroke-width="2" />
    <circle cx="225" cy="355" r="3.5" fill="#38bdf8" />
    <line x1="256" y1="340" x2="287" y2="355" stroke="#38bdf8" stroke-width="2" />
    <circle cx="287" cy="355" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Typography Label: UAE VISA AI -->
  <text x="256" y="475" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="5" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        filter="url(#shadow)">
    UAE VISA AI
  </text>
</svg>
