<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • UAE & Dubai Visa AI Hub</title>
  <meta name="theme-color" content="#0284c7">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      max-width: 460px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .icon-badge svg {
      width: 32px;
      height: 32px;
      stroke: #f59e0b;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #f59e0b;
      color: #020617;
      font-weight: 700;
      font-size: 13px;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #fbbf24;
    }
    .note {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #1e293b;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>ইন্টারনেট সংযোগ বিচ্ছিন্ন (Offline)</h1>
    <p>
      আপনি বর্তমানে অফলাইন মোডে আছেন। আপনার পূর্বের লোড করা ভিসা ফাইল এবং ক্যাশড ডাটা নিরাপদে সংরক্ষিত রয়েছে। ইন্টারনেট ফিরে আসামাত্র স্বয়ংক্রিয়ভাবে ক্লাউডে সিঙ্ক হবে।
    </p>
    <button class="btn" onclick="window.location.reload()">পুনরায় চেষ্টা করুন (Retry Connection)</button>
    <div class="note">
      PWABuilder Certified Offline Service Worker • UAE &amp; Dubai Visa AI Hub
    </div>
  </div>
</body>
</html>
